name: Build built container

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner to run against'
        required: true
        type: choice
        options:
          - github
          - self-hosted
          - arc-runner-set
          - gitea
        default: github
      environment:
        description: 'Environment to run against'
        required: true
        # type: environment
        type: choice
        options:
          - bookworm
          - jammy
          - noble
          - noble-custom
          - plucky
          - questing
          - sid
          - actions-runner
        default: noble
  # deployment:
  push:
    paths: &include_paths
      - 'tools/docker/noble/Dockerfile'

run-name: ${{ format('{0} ({1}/{2})', github.workflow, inputs.runner, inputs.environment) }}

env:
  REGISTRY: ${{ inputs.runner == 'github' && 'ghcr.io' || inputs.runner == 'gitea' && secrets.MYGITEA_REGISTRY_FQDN || 'ghcr.io' }}
  # REGISTRY_USER: ${{ inputs.runner == 'github' && github.actor || inputs.runner == 'gitea' && secrets.MYGITEA_REGISTRY_USER || secrets.REGISTRY_USER }}
  # REGISTRY_PWD: ${{ inputs.runner == 'github' && secrets.GITHUB_TOKEN || inputs.runner == 'gitea' && secrets.MYGITEA_REGISTRY_TOKEN || secrets.REGISTRY_PWD }}
  REGISTRY_USER: ${{ inputs.runner == 'gitea' && secrets.MYGITEA_REGISTRY_USER || github.repository_owner }}
  REGISTRY_PWD: ${{ inputs.runner == 'gitea' && secrets.MYGITEA_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
  RUNNER_TOOL_CACHE: /toolcache
  IMAGE_TAG: ""

jobs:
  resolve-runner:
    uses: ./.github/workflows/resolve-runner.yml
    with:
      runner: ${{ inputs.runner }}
      # blacksmith-label: blacksmith-8vcpu-ubuntu-2404

  build:
    needs: resolve-runner
    runs-on: ${{ needs.resolve-runner.outputs.runner }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write
    env:
      RUNNER_CHOICE: ${{ inputs.runner || 'github' }}
      ENVIRONMENT_CHOICE: ${{ inputs.environment || 'noble' }}
      BUILDKIT_PROGRESS: 'auto' # 'plain' 'quiet'
    steps:
      - name: Get docker guid
        id: get-docker-guid
        run: |
          # Some runner images do not have a 'docker' user. Fall back to current UID.
          if id -u docker >/dev/null 2>&1; then
            echo "docker-guid=$(id -u docker)" >> $GITHUB_OUTPUT
          else
            # echo "docker-guid=$(id -u)" >> $GITHUB_OUTPUT
            echo "docker-guid=1001" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Compose image tag
        id: compose-image-tag
        shell: bash
        run: |
          dImage="${{ env.REGISTRY }}/${{ github.repository }}"
          dTag="${{ env.ENVIRONMENT_CHOICE }}"
          # Use ,, to convert all characters to lowercase
          echo "IMAGE_TAG=${dImage,,}:${dTag,,}" | sudo tee -a $GITHUB_ENV

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          # registry: ${{ secrets.REGISTRY_PRIVATE_FQDN }} # https:// #:5000
          # username: ${{ secrets.REGISTRY_USER }}
          # password: ${{ secrets.REGISTRY_PWD }}
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PWD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_TAG }}
          # tags: |
          #   ${{ env.IMAGE_TAG }}
          #   type=ref,event=branch
          #   type=ref,event=pr
          #   type=semver,pattern={{version}}
          #   type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.ref.name=${{ env.IMAGE_TAG }}

      - name: Set up Docker Buildx
        if: ${{ inputs.runner != 'blacksmith' }}
        uses: docker/setup-buildx-action@v4
        with:
          name: builder-eddictwareelec # ${{ github.repository }}
          version: latest
          keep-state: true
          cleanup: false
          # https://github.com/moby/buildkit/blob/master/docs/buildkitd.toml.md
          # buildkitd-config-inline: |
          #   debug = false
          #   [registry."${{ secrets.REGISTRY_PRIVATE_FQDN }}"]
          #     http = false
          # buildkitd-flags: '"--progress ''plain''"'
      - name: Set up Docker Buildx for blacksmith
        if: ${{ inputs.runner == 'blacksmith' }}
        uses: useblacksmith/setup-docker-builder@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: ${{ env.IMAGE_TAG }}
          platforms: linux/amd64

      # - name: Cache Docker layers
      #   uses: actions/cache@v5
      #   with:
      #     path: /tmp/.buildx-cache
      #     key: ${{ runner.os }}-${{ env.DistroCodeName }}
      #     # restore-keys: ${{ runner.os }}-${{ github.repository }}-${{ github.ref_name }}

      - name: Build and export to (local/private) registry
        id: push
        if: ${{ inputs.runner != 'blacksmith' }}
        uses: docker/build-push-action@v7
        with:
          # context: "{{defaultContext}}:mysubdir"
          file: "./tools/docker/${{ env.ENVIRONMENT_CHOICE }}/Dockerfile"
          # outputs: type=cacheonly # build without pushing
          push: true
          tags: ${{ env.IMAGE_TAG }}
          # tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # target: custom
          no-cache: false
          # cache-from: type=registry,ref=${{ env.IMAGE_TAG }}:buildcache
          # cache-to: type=registry,ref=${{ env.IMAGE_TAG }}:buildcache,mode=max
          # cache-from: type=registry,ref=${{ vars.DOCKER_HUB_USERNAME }}/${{ vars.DOCKER_HUB_IMAGE_NAME }}.1:buildcache
          # cache-to: type=registry,ref=${{ vars.DOCKER_HUB_USERNAME }}/${{ vars.DOCKER_HUB_IMAGE_NAME }}.1:buildcache,mode=max
          # cache-from: type=local,src=/tmp/.buildx-cache
          # cache-to: type=local,mode=max,dest=/tmp/.buildx-cache-new
          # cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          # cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=min #mode=max
          build-args: |
            USER_UID=${{ steps.get-docker-guid.outputs.docker-guid }}
  #          --progress=plain
  #          DOCKER_BUILDKIT=0
      - name: Build and export to (local/private) registry
        id: push-bs
        if: ${{ inputs.runner == 'blacksmith' }}
        uses: useblacksmith/build-push-action@v2
        with:
          file: "./tools/docker/${{ env.ENVIRONMENT_CHOICE }}/Dockerfile"
          push: true
          tags: ${{ env.IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: false
          build-args: |
            USER_UID=${{ steps.get-docker-guid.outputs.docker-guid }}

      # - # Temp fix to prevent cache size keeps growing
      #   # https://docs.docker.com/build/ci/github-actions/cache/#local-cache
      #   name: Move cache
      #   run: |
      #     rm -rf /tmp/.buildx-cache
      #     mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_TAG }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
