---
name: Build prebuilt toolchain image

on:
  # push:
  #   paths:
  #     - 'packages/**'
  #     - 'tools/docker/noble/**'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner to run against'
        required: true
        type: choice
        options:
          - self-hosted
          - github
          - blacksmith
        default: self-hosted
      os:
        description: 'OS codename'
        required: true
        type: choice
        options:
          - bookworm
          - jammy
          - noble
          - noble-custom
          - plucky
          - questing
          - sid
        default: noble-custom
      arch:
        description: 'Arch of build target'
        required: true
        type: choice
        options:
          - amd64
          - aarch64
          - arm
          - x86_64
        default: aarch64
      debug:
        description: 'Enable debug build'
        required: true
        type: boolean
        default: false

run-name: ${{ format('{0} ({1}/{2}/{3}{4})', github.workflow, inputs.runner, inputs.os, inputs.arch, inputs.debug && '/debug' || '') }}

defaults:
  run:
    shell: bash

jobs:
  resolve-runner:
    uses: ./.github/workflows/resolve-runner.yml
    with:
      runner: ${{ inputs.runner }}
      debug: ${{ inputs.debug }}
      # blacksmith-label: blacksmith-8vcpu-ubuntu-2404

  build:
    needs: resolve-runner
    runs-on: ${{ needs.resolve-runner.outputs.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: eddictwareelec-prebuilt
      IMAGE_OS: ${{ inputs.os }}
      IMAGE_DEBUG: ${{ inputs.debug }}
      IMAGE_TAG: ""
      VALID_ARTIFACT_NAME: ""
      EE_REGISTRY: ghcr.io
      EE_REGISTRY_OWNER:
      EE_Distro: EddictwareELEC
      EE_Project: RPi
      EE_Device: RPi4
      EE_Arch: ${{ inputs.arch }}
    steps:
      - name: Set up QEMU (for cross-platform build)
        uses: docker/setup-qemu-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.EE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose image tag
        id: compose-image-tag
        run: |
          registry_owner="${{ github.repository_owner }}"
          registry_owner="${registry_owner,,}"
          echo "EE_REGISTRY_OWNER=$registry_owner" | sudo tee -a $GITHUB_ENV
          # IMAGE_TAG="${{ env.EE_Distro }}-${{ env.IMAGE_OS }}-${{ env.EE_Arch }}"
          IMAGE_TAG="${{ env.EE_REGISTRY }}/$registry_owner/${{ env.IMAGE_NAME }}:${{ env.IMAGE_OS }}-${{ env.EE_Arch }}"
          echo "IMAGE_TAG=${IMAGE_TAG,,}" | sudo tee -a $GITHUB_ENV
          # ghcr.io/eddict/eddictwareelec:noble-custom
          # ghcr.io/eddict/eddictwareelec-prebuilt:noble-custom-aarch64
          # Sanitize image tag for valid artifact name
          VALID_ARTIFACT_NAME="$(printf '%s' "$IMAGE_TAG" | tr '":<>|*?\/' '-')"
          echo "VALID_ARTIFACT_NAME=$VALID_ARTIFACT_NAME" | sudo tee -a $GITHUB_ENV

      - name: Checkout repository
        if: ${{ inputs.runner != 'blacksmith' }}
        uses: actions/checkout@v7
        # with:
        #   clean: true
      - name: Checkout repository for blacksmith
        if: ${{ inputs.runner == 'blacksmith' }}
        uses: useblacksmith/checkout@v1
        # with:
        #   clean: true

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.ref.name=${{ env.IMAGE_TAG }}

      - name: Set up Docker Buildx
        if: ${{ inputs.runner != 'blacksmith' }}
        uses: docker/setup-buildx-action@v4
        with:
          name: ${{ env.IMAGE_NAME }}
          version: latest
          keep-state: true
          cleanup: false
      - name: Set up Docker Buildx for blacksmith
        if: ${{ inputs.runner == 'blacksmith' }}
        uses: useblacksmith/setup-docker-builder@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: ${{ env.IMAGE_TAG }}
          platforms: linux/amd64

      - name: Build and push prebuilt image
        if: ${{ inputs.runner != 'blacksmith' }}
        uses: docker/build-push-action@v7
        with:
          # context: .
          file: tools/docker/${{ env.IMAGE_OS }}/prebuilt-toolchain.Dockerfile
          platforms: linux/amd64
          # platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REPO_OWNER=${{ env.EE_REGISTRY_OWNER }}
            OS=${{ env.IMAGE_OS }}
            DISTRO=${{ env.EE_Distro }}
            PROJECT=${{ env.EE_Project }}
            DEVICE=${{ env.EE_Device }}
            ARCH=${{ env.EE_Arch }}
            DIAG_OUTPUT=${{ env.IMAGE_DEBUG }}
          cache-from: type=gha
          cache-to: type=gha,mode=min #mode=max
      - name: Build and push prebuilt image for blacksmith
        if: ${{ inputs.runner == 'blacksmith' }}
        uses: useblacksmith/build-push-action@v2
        with:
          file: tools/docker/${{ env.IMAGE_OS }}/prebuilt-toolchain.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REPO_OWNER=${{ env.EE_REGISTRY_OWNER }}
            OS=${{ env.IMAGE_OS }}
            DISTRO=${{ env.EE_Distro }}
            PROJECT=${{ env.EE_Project }}
            DEVICE=${{ env.EE_Device }}
            ARCH=${{ env.EE_Arch }}
            DIAG_OUTPUT=${{ env.IMAGE_DEBUG }}

      - name: Upload logs as artifact
        if: ${{ success() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: prebuilt-toolchain-${{ env.VALID_ARTIFACT_NAME }}
          path: /opt/**/*.log
          if-no-files-found: warn

      # Ensure ownership alignment for the build directory
      - name: Fix permissions for build directory
        run: |
          # Check if the directory exists, create it if not
          BUILD_DIR="/build/build.${{ env.EE_Distro }}-${{ env.EE_Device }}.${{ env.EE_Arch }}-13.0-devel"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "Directory does not exist. Creating it..."
            sudo mkdir -p "$BUILD_DIR"
          fi

          DOCKER_UID=$(id -u docker 2>/dev/null || echo 1001)
          DOCKER_GID=$(id -g docker 2>/dev/null || echo 1001)
          echo "DOCKER_UID=$DOCKER_UID" | sudo tee -a $GITHUB_OUTPUT
          echo "DOCKER_GID=$DOCKER_GID" | sudo tee -a $GITHUB_OUTPUT
          sudo chown -R $DOCKER_UID:$DOCKER_GID "$BUILD_DIR" || true

          if [ ${{ env.IMAGE_DEBUG }} ]; then
            # Add diagnostics to verify ownership and permissions
            echo "=== Ownership and Permissions Diagnostics ==="
            ls -ld "$BUILD_DIR"
            find "$BUILD_DIR" -maxdepth 2 -exec stat -c "%U:%G %a %n" {} \;
          fi
