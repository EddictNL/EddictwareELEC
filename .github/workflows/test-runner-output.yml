name: Test the best/shortest runner logic

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner to run against'
        required: true
        type: choice
        options:
          - self-hosted
          - github
          - blacksmith
        default: self-hosted

defaults:
  run:
    shell: bash

jobs:
  runner:
    name: Output workflow runner
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.map.outputs.runner }}
    steps:
      - id: map
        run: >-
          echo "runner=${{
            inputs.runner == 'github' && 'ubuntu-latest' ||
            inputs.runner == 'blacksmith' && 'blacksmith-8vcpu-ubuntu-2404' ||
            inputs.runner
          }}" >> "$GITHUB_OUTPUT"
