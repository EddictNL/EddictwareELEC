name: Build image in container

on:
  # push:
  #   branches:
  #     - master
  # pull_request:
  #   branches:
  #     - master
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner to run against'
        required: true
        type: choice
        options:
          - self-hosted
          - aws
          - github
          - arc-runner-set
        default: self-hosted
      os:
        description: 'OS codename of build container'
        required: true
        type: choice
        options:
          - bookworm
          - jammy
          - noble
          - noble-custom
          - plucky
          - questing
          - sid
        default: noble
      arch:
        description: 'Arch of build target'
        required: true
        type: choice
        options:
          - amd64
          - aarch64
          - arm
          - x86_64
        default: aarch64
      debug:
        description: 'Enable debug build'
        required: true
        type: boolean
        default: false

run-name: ${{ format('{0} ({1}/{2}/{3}{4})', github.workflow, inputs.runner, inputs.os, inputs.arch, inputs.debug && '/debug' || '') }}

env:
  DEBUG: ${{ inputs.debug }}
  OS_Codename: ${{ inputs.os || 'noble' }}
  EE_Distro: EddictwareELEC
  EE_Project: RPi
  EE_Device: RPi4
  EE_Arch: ${{ inputs.arch || 'aarch64' }}
  EE_DistroTag: ""
  EE_image_pathfilename: ""
  EE_image_filename: ""
  # EE_Registry: ${{ secrets.REGISTRY_PRIVATE_FQDN }} # ${{ secrets.REGISTRY_FQDN }}
  EE_Registry: ghcr.io

defaults:
  run:
    shell: bash

jobs:
  resolve-runner:
    name: Resolve workflow runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      attestations: read
      id-token: write
    outputs:
      runner: ${{ steps.map.outputs.runner }}
    steps:
      - id: map
        uses: ./.github/actions/resolve-runner
        with:
          debug: ${{ inputs.debug }}
          runner: ${{ inputs.runner }}
          # blacksmith-label: blacksmith-8vcpu-ubuntu-2404

  init:
    if: ${{ github.event_name == 'workflow_dispatch' || github.actor != 'Eddict' }}
    needs: resolve-runner
    runs-on: ${{ needs.resolve-runner.outputs.runner }}
    permissions:
      contents: read
      packages: read
      attestations: read
      id-token: write
    # if: github.event.head_commit.author.username != 'Eddict' || github.event_name == 'workflow_dispatch'
    #   && github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
    env:
      BUILDKIT_PROGRESS: 'auto' # 'plain' 'quiet'
    # Expose step outputs as job outputs
    outputs:
      ee_distrotag: ${{ steps.compose-image-tag.outputs.EE_DistroTag }}
      runner_type: ${{ steps.determine-ids.outputs.RUNNER_TYPE }}
      host_uid: ${{ steps.determine-ids.outputs.HOST_UID }}
      host_gid: ${{ steps.determine-ids.outputs.HOST_GID }}
      # docker_uid: ${{ steps.determine-ids.outputs.DOCKER_UID }}
      # docker_gid: ${{ steps.determine-ids.outputs.DOCKER_GID }}
      img_uid: ${{ steps.determine-ids.outputs.IMG_UID }}
      img_gid: ${{ steps.determine-ids.outputs.IMG_GID }}
      build_dir: ${{ steps.determine-build-dir.outputs.BUILD_DIR }}

    steps:
      - name: Get Date
        id: get-date
        run: |
          # echo "[date]: $(/bin/date -u "+%Y%m%d")"
          echo "date=$(/bin/date -u "+%Y%m%d")" | tee -a $GITHUB_OUTPUT

      - name: Compose image tag
        id: compose-image-tag
        run: |
          dTag="${{ env.EE_Registry }}/${{ github.repository_owner }}/${{ env.EE_Distro }}:${{ env.OS_Codename }}"
          # Use ,, to convert all characters to lowercase
          echo "EE_DistroTag=${dTag,,}"
          echo "EE_DistroTag=${dTag,,}" | tee -a $GITHUB_ENV

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          # registry: ${{ secrets.REGISTRY_PRIVATE_FQDN }} #https:// #:5000
          # username: ${{ secrets.REGISTRY_USER }}
          # password: ${{ secrets.REGISTRY_PWD }}
          registry: ${{ env.EE_Registry }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine UIDs and GIDs
        id: determine-ids
        run: |
          RUNNER_TYPE="${{ inputs.runner || 'self-hosted' }}"
          HOST_UID=$(id -u)
          HOST_GID=$(id -g)

          # If the image check fails, fall back to the actual runtime host user/group
          if ! IMG_UID=$(docker run --rm --pull=always --entrypoint id ${{ env.EE_DistroTag }} -u 2>/dev/null); then
            if ! IMG_UID=$(id -u docker 2>/dev/null); then
              echo "::warning::Failed to fetch image UID from ${{ env.EE_DistroTag }}. Falling back to Host UID ($HOST_UID)."
              IMG_UID=$HOST_UID
            fi
          fi

          if ! IMG_GID=$(docker run --rm --pull=always --entrypoint id ${{ env.EE_DistroTag }} -g 2>/dev/null); then
            if ! IMG_GID=$(id -g docker 2>/dev/null); then
              echo "::warning::Failed to fetch image GID from ${{ env.EE_DistroTag }}. Falling back to Host GID ($HOST_GID)."
              IMG_GID=$HOST_GID
            fi
          fi

          # Output clean, reliable variables to the next steps
          echo "RUNNER_TYPE=$RUNNER_TYPE" | tee -a $GITHUB_OUTPUT
          echo "HOST_UID=$HOST_UID" | tee -a $GITHUB_OUTPUT
          echo "HOST_GID=$HOST_GID" | tee -a $GITHUB_OUTPUT
          echo "IMG_UID=$IMG_UID" | tee -a $GITHUB_OUTPUT
          echo "IMG_GID=$IMG_GID" | tee -a $GITHUB_OUTPUT

          # Handle Permission Alignment
          if [ "$IMG_UID" -ne "$HOST_UID" ]; then
            echo "UID mismatch detected ($IMG_UID vs $HOST_UID). Synchronizing..."
            
            GROUP_NAME=$(getent group "$HOST_GID" | cut -d: -f1)
            [ -z "$GROUP_NAME" ] && echo "Failed to resolve host GID $HOST_GID"

            USER_NAME=$(docker run --rm --entrypoint getent ${{ env.EE_DistroTag }} passwd "$IMG_UID" | cut -d: -f1)
            [ -z "$USER_NAME" ] && echo "Failed to resolve container UID $IMG_UID"

            if [ -n "$GROUP_NAME" ] && [ -n "$USER_NAME" ]; then
                sudo usermod -aG "$GROUP_NAME" "$USER_NAME" && \
                  echo "Added $USER_NAME to $GROUP_NAME" || \
                  echo "usermod failed (Is '$USER_NAME' missing from host passwd?)"
            fi
          fi

      - name: Determine BUILD_DIR
        id: determine-build-dir
        run: |
          BUILD_DIR="build.${{ env.EE_DistroTag }}-${{ env.EE_Device }}.${{ env.EE_Arch }}-13.0-devel"
          echo "BUILD_DIR=$BUILD_DIR" | tee -a $GITHUB_OUTPUT

  build:
    needs:
      - resolve-runner
      - init
    runs-on: ${{ needs.resolve-runner.outputs.runner }}
    env:
      HOST_UID: ${{ needs.init.outputs.host_uid }}
      HOST_GID: ${{ needs.init.outputs.host_gid }}
      IMG_UID: ${{ needs.init.outputs.img_uid }}
      IMG_GID: ${{ needs.init.outputs.img_gid }}
      RUNNER_TYPE: ${{ needs.init.outputs.runner_type }}
      CHMOD_SYNTAX: u=rwx,g=rwxs,o=rx # add the Group Sticky Bit (g+s) to enforce group write permissions
      BUILD_DIR: ${{ needs.init.outputs.build_dir }}
    steps:
      - name: Checkout repository
        if: ${{ inputs.runner != 'blacksmith' }}
        uses: actions/checkout@v7
      - name: Checkout repository for blacksmith
        if: ${{ inputs.runner == 'blacksmith' }}
        uses: useblacksmith/checkout@v1

      - &check-repo-folder # Define a reusable anchor for this step
        name: Check repo folder after checkout
        # if: env.DEBUG == 'true'
        # id: check-repo-folder # cannot reuse the same ID for multiple steps when using the anchor
        run: |
          echo "/etc/passwd"
          cat /etc/passwd
          echo "/etc/group"
          cat /etc/group
          echo "PWD: $PWD"
          echo "Listing contents of PWD:"
          ls -la $PWD
          echo "Listing contents of repository folder:"
          ls -la $GITHUB_WORKSPACE
          echo "Checking repository folder: $GITHUB_WORKSPACE"
          # Check if the repository folder exists and is not empty
          if [ ! -d "$GITHUB_WORKSPACE" ] || [ "$(ls -A $GITHUB_WORKSPACE 2>/dev/null | wc -l)" -eq 0 ]; then
            echo "Repository folder is missing or empty: $GITHUB_WORKSPACE"
            exit 1
          fi

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          # registry: ${{ secrets.REGISTRY_PRIVATE_FQDN }} #https:// #:5000
          # username: ${{ secrets.REGISTRY_USER }}
          # password: ${{ secrets.REGISTRY_PWD }}
          registry: ${{ env.EE_Registry }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing build cache (self-hosted only)
        id: check-build-cache
        if: ${{ inputs.runner == 'self-hosted' || inputs.runner == 'aws' }}
        run: |
          # Check if all required cache dirs/files exist and are non-empty
          missing=0
          for d in .ccache build.${{ env.EE_DistroTag }}-${{ env.EE_Device }}.${{ env.EE_Arch }}-13.0-devel/.ccache build.${{ env.EE_DistroTag }}-${{ env.EE_Device }}.${{ env.EE_Arch }}-13.0-devel/.stamps build.${{ env.EE_DistroTag }}-${{ env.EE_Device }}.${{ env.EE_Arch }}-13.0-devel/.cache_package_global sources; do
            if [ ! -e "$d" ] || [ "$(ls -A $d 2>/dev/null | wc -l)" -eq 0 ]; then
              echo "Cache missing or empty: $d"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "build_cache_present=true" >> $GITHUB_OUTPUT
          else
            echo "build_cache_present=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore build caches
        id: restore-build-caches
        if: ${{ inputs.runner != 'self-hosted' || steps.check-build-cache.outputs.build_cache_present != 'true' }}
        uses: actions/cache@v5
        with:
          path: |
            .ccache
            build.${{ env.EE_DistroTag }}-${{ env.EE_Device }}.${{ env.EE_Arch }}-13.0-devel/.ccache
            build.${{ env.EE_DistroTag }}-${{ env.EE_Device }}.${{ env.EE_Arch }}-13.0-devel/.stamps
            build.${{ env.EE_DistroTag }}-${{ env.EE_Device }}.${{ env.EE_Arch }}-13.0-devel/.cache_package_global
            sources
          key: ${{ runner.os }}-eddict-${{ env.OS_Codename }}-${{ env.EE_Arch }}-ccache-${{ hashFiles('packages/**/package.mk') }}
          restore-keys: |
            ${{ runner.os }}-eddict-${{ env.OS_Codename }}-${{ env.EE_Arch }}-ccache-

      - name: Restore apt cache
        id: restore-apt-cache
        uses: actions/cache@v5
        with:
          path: .apt-cache/archives
          key: ${{ runner.os }}-apt-${{ env.OS_Codename }}-${{ env.EE_Arch }}-${{ hashFiles('tools/docker/**/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-apt-${{ env.OS_Codename }}-${{ env.EE_Arch }}-

      - name: Download persisted caches (artifacts) as fallback
        id: download-ccache-artifact
        if: ${{ steps.restore-build-caches.outputs.cache-hit != 'true' }}
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ccache-${{ env.OS_Codename }}-${{ env.EE_Arch }}
          # extract at repository root so multi-path artifacts (e.g. build/.ccache, sources)
          # are restored to their correct locations
          path: .

      - name: Download persisted stamps (artifacts) as fallback
        id: download-stamps-artifact
        if: ${{ steps.restore-build-caches.outputs.cache-hit != 'true' }}
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: stamps-${{ env.OS_Codename }}-${{ env.EE_Arch }}
          path: build.${{ env.EE_DistroTag }}-${{ env.EE_Device }}.${{ env.EE_Arch }}-13.0-devel/.stamps

      - name: Download persisted apt cache (artifacts) as fallback
        id: download-apt-artifact
        if: ${{ steps.restore-apt-cache.outputs.cache-hit != 'true' }}
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: apt-${{ env.OS_Codename }}-${{ env.EE_Arch }}
          path: .apt-cache/archives

      - name: Prepare cache dirs for container
        run: |
          if [ "${{ env.DEBUG }}" = "true" ]; then
            ls -al "$PWD" && echo "----------------------------------------"
          fi

          mkdir -p .ccache "${{ env.BUILD_DIR }}/.stamps" .apt-cache/archives
          touch "${{ env.BUILD_DIR }}/.cache_package_global" "${{ env.BUILD_DIR }}/.cache_package_local"

          sudo chown -R ${{ env.HOST_UID }}:${{ env.HOST_GID }} .ccache "${{ env.BUILD_DIR }}" .apt-cache || true
          sudo chmod -R ${{ env.CHMOD_SYNTAX }} .ccache "${{ env.BUILD_DIR }}" .apt-cache || true

          sudo chmod a=rw "${{ env.BUILD_DIR }}/.cache_package_global" || true
          sudo chmod a=rw "${{ env.BUILD_DIR }}/.cache_package_local" || true

          if [ "${{ env.RUNNER_TYPE }}" != "github" ]; then
            echo "Self-hosted runner detected: Aligning full workspace ownership"
            sudo chown -R ${{ env.HOST_UID }}:${{ env.HOST_GID }} "${GITHUB_WORKSPACE}" || true
          fi

      - name: Host diagnostics
        id: host-diagnostics
        if: ${{ env.DEBUG == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          DIAG_DIR="${{ github.workspace }}/ci-diagnostics"
          DIAG_LOG="$DIAG_DIR/host.log"
          mkdir -p "$DIAG_DIR"
          echo "HOST DIAGNOSTIC: $(date -u)" > "$DIAG_LOG" || true
          uname -a >> "$DIAG_LOG" 2>&1 || true
          echo "--- docker --version ---" >> "$DIAG_LOG" 2>&1 || true
          docker --version >> "$DIAG_LOG" 2>&1 || echo "docker: not found" >> "$DIAG_LOG" || true
          echo "--- g++ ---" >> "$DIAG_LOG" 2>&1 || true
          if command -v g++ >/dev/null 2>&1; then g++ --version >> "$DIAG_LOG" 2>&1; else echo "g++: not found on host" >> "$DIAG_LOG"; fi
          echo "--- libgcc_s on host ---" >> "$DIAG_LOG" 2>&1 || true
          ls -l /usr/lib*/libgcc_s* >> "$DIAG_LOG" 2>&1 || true
          echo "--- perl/makeinfo presence ---" >> "$DIAG_LOG" 2>&1 || true
          command -v perl >> "$DIAG_LOG" 2>&1 || echo "perl: not found" >> "$DIAG_LOG"
          command -v makeinfo >> "$DIAG_LOG" 2>&1 || echo "makeinfo: not found" >> "$DIAG_LOG"
          echo "--- workspace top files ---" >> "$DIAG_LOG" 2>&1 || true
          ls -al "$PWD" | sed -n '1,200p' >> "$DIAG_LOG" 2>&1 || true

      - name: In-container diagnostics
        id: in-container-diagnostics
        if: ${{ env.DEBUG == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          IMAGE="${{ env.EE_DistroTag }}"
          echo "Running in-container diagnostics inside image: $IMAGE"

          # Pull image best-effort
          docker image pull "$IMAGE" || true

          # Run container with matched image user and supplementary host group
          docker run --rm \
            --user ${{ env.IMG_UID }}:${{ env.IMG_GID }} \
            --group-add ${{ env.HOST_GID }} \
            -v "${{ github.workspace }}:/build" \
            -w /build \
            "$IMAGE" bash -lc '
            # Force group-write permissions for any diagnostic file created here
            umask 0002
            set -euo pipefail
            DIAG_DIR=/build/ci-diagnostics
            DIAG_LOG="$DIAG_DIR/in-container.log"
            mkdir -p "$DIAG_DIR"
            echo "CONTAINER DIAGNOSTIC: $(date -u)" > "$DIAG_LOG" || true
            echo "--- id ---" >> "$DIAG_LOG" 2>&1 || true
            id >> "$DIAG_LOG" 2>&1 || true
            echo "--- toolchain dirs ---" >> "$DIAG_LOG" 2>&1 || true
            ls -ld /build/build.*-13.0-devel/toolchain >>"$DIAG_LOG" 2>&1 || true
            TOOLCHAIN_DIR=$(ls -d /build/build.*-13.0-devel/toolchain 2>/dev/null || true)
            if [ -n "$TOOLCHAIN_DIR" ]; then
              echo "Toolchain: $TOOLCHAIN_DIR" >> "$DIAG_LOG" 2>&1 || true
              echo "--- bin listing ---" >> "$DIAG_LOG" 2>&1 || true
              ls -l "$TOOLCHAIN_DIR/bin" >> "$DIAG_LOG" 2>&1 || true
              for g in host-g++ aarch64-libreelec-linux-gnu-g++ g++; do
                if [ -x "$TOOLCHAIN_DIR/bin/$g" ]; then
                  echo "--- $g --version ---" >> "$DIAG_LOG" 2>&1 || true
                  "$TOOLCHAIN_DIR/bin/$g" --version >> "$DIAG_LOG" 2>&1 || true
                  echo "--- attempting link test with $g ---" >> "$DIAG_LOG" 2>&1 || true
                  printf "%s\n" "#include <iostream>" "int main(){ std::cout << \"ok\\n\"; return 0; }" > /tmp/test.cpp
                  if "$TOOLCHAIN_DIR/bin/$g" -o /tmp/test /tmp/test.cpp 2>>"$DIAG_LOG"; then
                    echo "$g link: OK" >> "$DIAG_LOG" 2>&1 || true
                  else
                    echo "$g link: FAILED" >> "$DIAG_LOG" 2>&1 || true
                  fi
                fi
              done
              echo "--- sysroot libgcc_s ---" >> "$DIAG_LOG" 2>&1 || true
              ls -l "$TOOLCHAIN_DIR"/aarch64-libreelec-linux-gnu/sysroot/usr/lib*/libgcc_s* >>"$DIAG_LOG" 2>&1 || true
              ls -l "$TOOLCHAIN_DIR"/lib/gcc/*/*/libgcc_s* >>"$DIAG_LOG" 2>&1 || true
            fi
            # copy any existing glibc config.log from previous runs into diagnostics
            find /build -type f -path "*/build/glibc-*/config.log" -maxdepth 6 -print -exec cp {} "$DIAG_DIR" \; 2>/dev/null || true
          '

      - name: Upload CI diagnostics
        if: ${{ always() && !cancelled() && env.DEBUG == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ env.OS_Codename }}-${{ env.EE_Arch }}
          path: |
            ci-diagnostics
            build.${{ env.EE_DistroTag }}-${{ env.EE_Device }}.${{ env.EE_Arch }}-13.0-devel/**/config.log
          if-no-files-found: warn

      - name: Prepare container parameters
        id: prepare-container-params
        run: |
          # on self-hosted runners request a larger container memory; allow override via CONTAINER_MEMORY
          if [ "${{ env.RUNNER_TYPE }}" != "github" ]; then
            CONTAINER_MEMORY="${CONTAINER_MEMORY:-12g}"
            MEMORY_ARG="--memory=${CONTAINER_MEMORY}"
          else
            MEMORY_ARG=""
          fi
          # Write a small shell fragment into the workspace that can be sourced on the host
          # to provide docker run flags (MEMORY_ARG) and other host-side params if needed.
          OUTFILE="${{ github.workspace }}/container_params.sh"
          # Write concrete value (expand MEMORY_ARG here) so the host can source it
          echo "#!/bin/bash" > "$OUTFILE"
          echo "# Generated by prepare-container-params" >> "$OUTFILE"
          echo "MEMORY_ARG='${MEMORY_ARG}'" >> "$OUTFILE"
          sudo chmod +x "$OUTFILE" || true
          if [ "${{ env.DEBUG }}" = "true" ]; then
            echo "[container_params.sh written]: $OUTFILE"
          fi

      - name: Create build_recommend script
        id: create-build-recommend
        run: |
          # create a small script in the workspace to compute a safe -j inside the container
          if [ "${{ env.DEBUG }}" = "true" ]; then
            cat > "${{ github.workspace }}/build_recommend.sh" <<'EOF'
          #!/bin/bash
          set -euo pipefail
          echo "=== MAKE-RELATED ENV ==="
          env | grep -E "MAKEFLAGS|THREAD|MTIMMEDIATE|ONELOG|LOGCOMBINE" || true
          echo "=== CONTAINER ID/UID/GID ==="
          id || true
          echo "=== /build ownership (top-level) ==="
          ls -ld /build || true
          echo "=== cache files ownership/perm ==="
          stat -c '%U:%G %a %n' /build/.ccache /build/build.*-13.0-devel/.cache_package_global /build/build.*-13.0-devel/.cache_package_local /build/build.*-13.0-devel/.ccache 2>/dev/null || true
          echo "=== THREAD_CONTROL / THREADCOUNT env ==="
          env | grep -E 'THREAD|THREAD_CONTROL|THREADCOUNT' || true
          echo "=== running pkgbuild / pkgbuilder processes ==="
          ps -ef | egrep 'pkgbuild|pkgbuilder.py' || true
          echo "=== CURRENT make PROCESSES ==="
          ps -ef | grep "[m]ake" || true
          NB_CORES=$(grep -c '^processor' /proc/cpuinfo || nproc)
          PER_JOB_MB=${PER_JOB_MB:-2000}
          RESERVE_MB=${RESERVE_MB:-2048}
          mem_bytes=0
          if [ -f /sys/fs/cgroup/memory.max ]; then
            memmax=$(cat /sys/fs/cgroup/memory.max)
            if [ "$memmax" != "max" ]; then
              mem_bytes=$memmax
            fi
          fi
          if [ "$mem_bytes" -eq 0 ] 2>/dev/null; then
            if [ -f /sys/fs/cgroup/memory/memory.limit_in_bytes ]; then
              memlim=$(cat /sys/fs/cgroup/memory/memory.limit_in_bytes)
              if [ "$memlim" -lt 9223372036854771712 ] 2>/dev/null; then
                mem_bytes=$memlim
              fi
            fi
          fi
          if [ "$mem_bytes" -eq 0 ] 2>/dev/null; then
            mem_kb=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
            mem_bytes=$((mem_kb*1024))
          fi
          TOTAL_MB=$((mem_bytes/1024/1024))
          USABLE_MB=$((TOTAL_MB-RESERVE_MB))
          if [ "$USABLE_MB" -lt 256 ]; then USABLE_MB=256; fi
          MAX_J_BY_RAM=$((USABLE_MB/PER_JOB_MB))
          if [ "$MAX_J_BY_RAM" -lt 1 ]; then MAX_J_BY_RAM=1; fi
          CANDIDATE_J=$((NB_CORES+2))
          if [ "$CANDIDATE_J" -gt "$MAX_J_BY_RAM" ]; then RECOMMENDED_J=$MAX_J_BY_RAM; else RECOMMENDED_J=$CANDIDATE_J; fi
          if [ "$RECOMMENDED_J" -gt $((NB_CORES*2)) ]; then RECOMMENDED_J=$((NB_CORES*2)); fi
          echo "Using make -j${RECOMMENDED_J} -l${NB_CORES}"
          EOF
          else
            # Lean non-diagnostic build script for normal runs
            cat > "${{ github.workspace }}/build_recommend.sh" <<'EOF'
          #!/bin/bash
          set -euo pipefail
          NB_CORES=$(grep -c '^processor' /proc/cpuinfo || nproc)
          PER_JOB_MB=${PER_JOB_MB:-2000}
          RESERVE_MB=${RESERVE_MB:-2048}
          mem_bytes=0
          if [ -f /sys/fs/cgroup/memory.max ]; then
            memmax=$(cat /sys/fs/cgroup/memory.max)
            if [ "$memmax" != "max" ]; then
              mem_bytes=$memmax
            fi
          fi
          if [ "$mem_bytes" -eq 0 ] 2>/dev/null; then
            if [ -f /sys/fs/cgroup/memory/memory.limit_in_bytes ]; then
              memlim=$(cat /sys/fs/cgroup/memory/memory.limit_in_bytes)
              if [ "$memlim" -lt 9223372036854771712 ] 2>/dev/null; then
                mem_bytes=$memlim
              fi
            fi
          fi
          if [ "$mem_bytes" -eq 0 ] 2>/dev/null; then
            mem_kb=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
            mem_bytes=$((mem_kb*1024))
          fi
          TOTAL_MB=$((mem_bytes/1024/1024))
          USABLE_MB=$((TOTAL_MB-RESERVE_MB))
          if [ "$USABLE_MB" -lt 256 ]; then USABLE_MB=256; fi
          MAX_J_BY_RAM=$((USABLE_MB/PER_JOB_MB))
          if [ "$MAX_J_BY_RAM" -lt 1 ]; then MAX_J_BY_RAM=1; fi
          CANDIDATE_J=$((NB_CORES+2))
          if [ "$CANDIDATE_J" -gt "$MAX_J_BY_RAM" ]; then RECOMMENDED_J=$MAX_J_BY_RAM; else RECOMMENDED_J=$CANDIDATE_J; fi
          if [ "$RECOMMENDED_J" -gt $((NB_CORES*2)) ]; then RECOMMENDED_J=$((NB_CORES*2)); fi
          EOF
          fi

          sudo chmod +x "${{ github.workspace }}/build_recommend.sh" || true

      - name: Populate prebuilt toolchain
        id: populate-toolchain
        run: |
          set -euo pipefail
          registry_owner="${{ github.repository_owner }}"
          registry_owner="${registry_owner,,}"
          PREBUILT_IMAGE="${{ env.EE_Registry }}/${registry_owner}/eddictwareelec-prebuilt:${{ env.OS_Codename }}-${{ env.EE_Arch }}"
          echo "PREBUILT_IMAGE=$PREBUILT_IMAGE" | tee -a $GITHUB_ENV
          if [ "${{ env.DEBUG }}" = "true" ]; then DOCKER_DEBUG="--debug"; else DOCKER_DEBUG=""; fi
          echo "DOCKER_DEBUG=${DOCKER_DEBUG}"
          echo "Looking for prebuilt image: $PREBUILT_IMAGE"
          # Diagnostic: check /opt/prebuilt-toolchain in prebuilt image
          docker run --rm \
            --user ${{ env.IMG_UID }}:${{ env.IMG_GID }} \
            --group-add ${{ env.HOST_GID }} \
            "$PREBUILT_IMAGE" bash -c '
            umask 0002
            echo "--- DIAGNOSTIC: /opt/prebuilt-toolchain ---"
            ls -l /opt/prebuilt-toolchain || true
            find /opt/prebuilt-toolchain -type f | xargs ls -l || true
            stat /opt/prebuilt-toolchain || true'
          if ! docker ${DOCKER_DEBUG} image inspect "$PREBUILT_IMAGE" >/dev/null 2>&1; then
            echo "Prebuilt image not present locally, attempting to pull"
            if ! docker ${DOCKER_DEBUG} pull "$PREBUILT_IMAGE"; then
              echo "Prebuilt image not available; skipping populate-toolchain"
              exit 0
            fi
          fi
          TARGET_TOOLCHAIN="${{ github.workspace }}/${{ env.BUILD_DIR }}/toolchain"
          echo "TARGET_TOOLCHAIN=$TARGET_TOOLCHAIN" | tee -a $GITHUB_ENV
          if [ -d "$TARGET_TOOLCHAIN" ]; then
            echo "Toolchain already present at $TARGET_TOOLCHAIN; skipping copy"
            exit 0
          fi
          mkdir -p "$TARGET_TOOLCHAIN"
          # Ensure permissions before copying
          sudo chmod -R ${{ env.CHMOD_SYNTAX }} "$TARGET_TOOLCHAIN" || true
          docker run --rm \
            --user ${{ env.IMG_UID }}:${{ env.IMG_GID }} \
            --group-add ${{ env.HOST_GID }} \
            -v "${{ github.workspace }}:/build" \
            "$PREBUILT_IMAGE" bash -lc "
            umask 0002
            set -euo pipefail
            if [ -d /opt/prebuilt-toolchain ];
              then cp -a /opt/prebuilt-toolchain/* /build/${BUILD_DIR}/ || true
            fi"
          sudo chown -R ${{ env.HOST_UID }}:${{ env.HOST_GID }} "$TARGET_TOOLCHAIN" || true

      - name: Upload toolchain artifact (after population)
        if: ${{ success() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: toolchain-${{ env.OS_Codename }}-${{ env.EE_Arch }}
          path: build.${{ env.EE_DistroTag }}-${{ env.EE_Device }}.${{ env.EE_Arch }}-13.0-devel/toolchain
          if-no-files-found: warn
      # Fallback for missing toolchain after all artifact/copy attempts
      - name: Add fallback for missing toolchain (post-artifact)
        run: |
          if [ ! -d "$TARGET_TOOLCHAIN" ]; then
            echo "Toolchain directory missing. Attempting to recreate."
            mkdir -p "$TARGET_TOOLCHAIN"
            docker run --rm \
            --user ${{ env.IMG_UID }}:${{ env.IMG_GID }} \
            --group-add ${{ env.HOST_GID }} \
            -v "${{ github.workspace }}:/build" \
            "$PREBUILT_IMAGE" bash -lc "
            umask 0002
            cp -a /opt/prebuilt-toolchain/* /build/${BUILD_DIR}/ || true
            "
          fi

      - name: In-container diagnostics (post-prebuild)
        id: in-container-diagnostics-post
        if: ${{ env.DEBUG == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          IMAGE="${{ env.EE_DistroTag }}"
          echo "Running post-prebuild in-container diagnostics inside image: $IMAGE"
          docker image pull "$IMAGE" || true
          docker run --rm \
            --user ${{ env.IMG_UID }}:${{ env.IMG_GID }} \
            --group-add ${{ env.HOST_GID }} \
            -v "${{ github.workspace }}:/build" \
            -w /build "$IMAGE" bash -lc '
            umask 0002
            set -euo pipefail
            DIAG_DIR=/build/ci-diagnostics
            DIAG_LOG="$DIAG_DIR/in-container-post.log"
            mkdir -p "$DIAG_DIR"
            echo "POST-PREBUILD CONTAINER DIAGNOSTIC: $(date -u)" > "$DIAG_LOG" || true
            echo "--- id ---" >> "$DIAG_LOG" 2>&1 || true
            id >> "$DIAG_LOG" 2>&1 || true
            echo "--- /build listing ---" >> "$DIAG_LOG" 2>&1 || true
            ls -ld /build || true >> "$DIAG_LOG" 2>&1 || true
            echo "--- toolchain dirs ---" >> "$DIAG_LOG" 2>&1 || true
            ls -ld /build/build.*-13.0-devel/toolchain >>"$DIAG_LOG" 2>&1 || true
            TOOLCHAIN_DIR=$(ls -d /build/build.*-13.0-devel/toolchain 2>/dev/null || true)
            if [ -n "$TOOLCHAIN_DIR" ]; then
              echo "Toolchain: $TOOLCHAIN_DIR" >> "$DIAG_LOG" 2>&1 || true
              ls -l "$TOOLCHAIN_DIR/bin" >> "$DIAG_LOG" 2>&1 || true
            else
              echo "No toolchain directory present" >> "$DIAG_LOG" 2>&1 || true
            fi
            # copy any existing glibc config.log into diagnostics
            find /build -type f -path "*/build/glibc-*/config.log" -maxdepth 6 -print -exec cp {} "$DIAG_DIR/" \; 2>/dev/null || true
          '

      - name: Upload CI diagnostics (post-prebuild)
        id: upload-ci-diagnostics-post
        if: ${{ always() && !cancelled() && env.DEBUG == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-post-${{ env.OS_Codename }}-${{ env.EE_Arch }}
          path: |
            ci-diagnostics
            ci-diagnostics/in-container-post.log
            build.${{ env.EE_DistroTag }}-${{ env.EE_Device }}.${{ env.EE_Arch }}-13.0-devel/**/config.log
            ci-diagnostics/prebuild.log
          if-no-files-found: warn

      # Repeat the check-repo-folder step to ensure the repository folder is still valid before building the image
      - *check-repo-folder

      - name: Build ${{ env.EE_DistroTag }} image
        id: build-image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ "${{ env.DEBUG }}" = "true" ] && echo "[pwd]: $PWD" || true
          [ "${{ env.DEBUG }}" = "true" ] && echo "[github.workspace]: ${{ github.workspace }}" || true
          [ "${{ env.DEBUG }}" = "true" ] && ls -al $PWD || true
          # set some build performance flags
          NB_CORES=$(grep -c '^processor' /proc/cpuinfo)
          [ "${{ env.DEBUG }}" = "true" ] && echo "[NB_CORES]: $NB_CORES" || true

          # pull the image (authentication is handled by docker/login-action@v4)
          if [ "${{ env.DEBUG }}" = "true" ]; then DOCKER_DEBUG="--debug"; else DOCKER_DEBUG=""; fi
          docker $DOCKER_DEBUG image pull "${{ env.EE_DistroTag }}"
          # Determine image numeric UID/GID for CAN_WRITE test; prefer image UID when available
          if [ -n "${{ env.IMG_UID }}" ]; then
            echo "Image UID:GID for CAN_WRITE test = ${{ env.IMG_UID }}:${{ env.IMG_GID }}"
          fi
          # (image UID/GID chown moved below after BUILD_DIR is set)
          # Diagnostic: run a short container to print UID/GID and test writing to cache dirs
          # decide mount strategy based on runner input: always use named docker volumes for runtime
          # make the volume prefix target-specific from EE_Distro (distro + codename + arch)
          VOLUME_PREFIX="${{ env.EE_DistroTag }}-${{ env.OS_Codename }}-${{ env.EE_Arch }}"
          [ "${{ env.DEBUG }}" = "true" ] && echo "[VOLUME_PREFIX]: $VOLUME_PREFIX" || true
          VOL_CCACHE="${VOLUME_PREFIX}-ccache"
          VOL_STAMPS="${VOLUME_PREFIX}-stamps"
          VOL_APT="${VOLUME_PREFIX}-apt"
          # Docker volume creation and chown initialization removed: caches are persisted via artifacts/actions/cache
          # (VOL_CCACHE, VOL_STAMPS, VOL_APT variable names kept for compatibility)
          # we persist caches via GitHub artifacts instead of docker volumes
          MOUNT_CCACHE=""
          MOUNT_STAMPS=""
          MOUNT_APT=""
          [ "${{ env.DEBUG }}" = "true" ] && echo "[MOUNT_CCACHE]: $MOUNT_CCACHE" || true
          [ "${{ env.DEBUG }}" = "true" ] && echo "[MOUNT_STAMPS]: $MOUNT_STAMPS" || true
          [ "${{ env.DEBUG }}" = "true" ] && echo "[MOUNT_APT]: $MOUNT_APT" || true
          # Runner workspace will be mounted directly into the container at /build
          echo "Using runner workspace mount -v \\${{ github.workspace }}:/build"

          # test whether the IMG_UID can create files in the mounted workspace; if not, we'll run the build as root
          CAN_WRITE=$(docker run --rm --user ${{ env.IMG_UID }}:${{ env.IMG_GID }} --group-add ${{ env.HOST_GID }} -v "${{ github.workspace }}:/build" alpine sh -c "touch /build/.perm_test >/dev/null 2>&1 && echo OK || echo FAIL") || CAN_WRITE=FAIL
          if [ "${CAN_WRITE}" != "OK" ]; then
            echo "Volume not writable by ${{ env.IMG_UID }}; will run build container as root"
            USER_ARG=""
            GROUP_ARG=""
          else
            echo "Volume writable by ${{ env.IMG_UID }}; running build container as that UID"
            USER_ARG="--user ${{ env.IMG_UID }}:${{ env.IMG_GID }}"
            GROUP_ARG="--group-add ${{ env.HOST_GID }}"
          fi
          echo "USER_ARG: $USER_ARG"
          echo "GROUP_ARG: $GROUP_ARG"
          echo "HOST_UID: $HOST_UID"
          echo "HOST_GID: $HOST_GID"
          echo "IMG_UID: $IMG_UID"
          echo "IMG_GID: $IMG_GID"

          # Run the build container. If running on GitHub-hosted runner, tell git to trust /build
          # to avoid 'dubious ownership' errors caused by bind-mounted repos.
          # if [ "$(docker ps -aq -f status=exited -f name=build${{ env.EE_DistroTag }}.${{ env.OS_Codename }})" ]; then
          # if [ "$(docker ps -aq -f name=build${{ env.EE_DistroTag }}.${{ env.OS_Codename }})" ]; then
          #     # cleanup
          #     docker rm --force --volumes "build${{ env.EE_DistroTag }}.${{ env.OS_Codename }}"
          # fi

          # run the container (use debug env values when workflow input `debug` is 'true')
          if [ "${{ env.DEBUG }}" = "true" ]; then
            ONELOG_VAL=no
            LOGCOMBINE_VAL=never
            MTIMMEDIATE_VAL=yes
            MTDEBUG_VAL=yes
            MTVERBOSE_VAL=yes
            MTPROGRESS_VAL=no
            SHOW_STDOUT_VAL=yes
            SHOW_STDERR_VAL=yes
          else
            ONELOG_VAL=no
            LOGCOMBINE_VAL=fail
            MTIMMEDIATE_VAL=no
            MTDEBUG_VAL=no
            MTVERBOSE_VAL=no
            MTPROGRESS_VAL=no
            SHOW_STDOUT_VAL=no
            SHOW_STDERR_VAL=no
          fi

          DOCKER_ENV_FLAGS="-e ONELOG=${ONELOG_VAL} -e LOGCOMBINE=${LOGCOMBINE_VAL} -e MTIMMEDIATE=${MTIMMEDIATE_VAL} -e MTDEBUG=${MTDEBUG_VAL} -e MTVERBOSE=${MTVERBOSE_VAL} -e MTPROGRESS=${MTPROGRESS_VAL} -e SHOW_STDOUT=${SHOW_STDOUT_VAL} -e SHOW_STDERR=${SHOW_STDERR_VAL}"
          [ "${{ env.DEBUG }}" = "true" ] && echo "[DOCKER_ENV_FLAGS]: $DOCKER_ENV_FLAGS" || true

          # USER_ARG already set by the CAN_WRITE test above (prefers the container UID when writable).
          # Do not override here; RUNNER_TYPE is used only for MEMORY_ARG and git handling.

          # Ensure the workspace is writable by the container user by initializing ownership inside a short container
          # Diagnostic: capture workspace ownership/permission snapshot before attempting chown
          DIAG_FILE="${RUNNER_TEMP:-/tmp}/diagnostic_pre_chown.txt"
          if [ "${{ env.DEBUG }}" = "true" ]; then
            echo "Writing pre-chown diagnostic to ${DIAG_FILE}"
            echo "DIAGNOSTIC PRE-CHOWN: $(/bin/date -u)" > "${DIAG_FILE}" || true
            ls -al "${GITHUB_WORKSPACE}" | sed -n '1,200p' >> "${DIAG_FILE}" || true
            ls -alR "${GITHUB_WORKSPACE}" | sed -n '1,500p' >> "${DIAG_FILE}" || true
            echo "END DIAGNOSTIC" >> "${DIAG_FILE}" || true
          else
            # create an empty diagnostic file for symmetry so later steps can reference it
            : > "${DIAG_FILE}" || true
          fi

          echo "--------------Makefile---------------------"
          git status --porcelain --ignored
          ls -la Makefile scripts/image
          cat Makefile | sed -n '1,15p'
          echo "--------------Makefile---------------------"


          # Source host-side container params (MEMORY_ARG etc) before invoking docker
          . "${{ github.workspace }}/container_params.sh" && docker run --rm $MEMORY_ARG \
            --name "build${{ env.EE_DistroTag }}.${{ env.OS_Codename }}" \
            -v ${{ github.workspace }}:/build \
            -w /build \
            ${USER_ARG} \
            ${GROUP_ARG} \
            -e CCACHE_DIR=/build/build.${{ env.EE_DistroTag }}-${{ env.EE_Device }}.${{ env.EE_Arch }}-13.0-devel/.ccache \
            -e DISABLE_COLORS=no \
            -e MTCOLORS=auto \
            ${DOCKER_ENV_FLAGS} \
            -e DISTRO=${{ env.EE_DistroTag }} \
            -e PROJECT=${{ env.EE_Project }} \
            -e DEVICE=${{ env.EE_Device }} \
            -e ARCH=${{ env.EE_Arch }} \
            -e BUILDER_NAME=Eddict \
            -e BUILDER_VERSION="13.0-$(date +%Y%m%d)" \
            -e RUNNER_TYPE=${{ env.RUNNER_TYPE }} \
            "${{ env.EE_DistroTag }}" bash -lc \
            "umask 0002 && . /build/build_recommend.sh && git config --global --add safe.directory /build || true; make -j${RECOMMENDED_J} -l${NB_CORES} image"
          docker_exit_code=$?

      - name: github-workspace
        id: ls-ghws
        if: ${{ env.DEBUG == 'true' }}
        run: |
          [ "${{ env.DEBUG }}" = "true" ] && echo "[github.workspace]: ${{ github.workspace }}" || true
          [ "${{ env.DEBUG }}" = "true" ] && ls -al ${{ github.workspace }} || true

      # https://stackoverflow.com/a/57877438
      # Artifacts uploaded below — download steps for cache fallbacks exist earlier.
      # Symmetry note:
      # - ccache-...  <=> actions/download-artifact name: ccache-...
      # - stamps-...  <=> actions/download-artifact name: stamps-...
      # - apt-...     <=> actions/download-artifact name: apt-...
      # The following artifacts are intentionally uploaded only (no download step):
      # - artifact_logs_...  (uploaded on failure for debugging)
      # - built image artifact (final product)
      # Keep uploads `if: always()` so fallback artifacts are refreshed.
      - uses: actions/upload-artifact@v7
        if: ${{ always() && !cancelled() && steps.build-image.outcome == 'failure' }}
        with:
          name: artifact_logs_${{ env.EE_DistroTag }}-${{ env.EE_Device }}.${{ env.EE_Arch }}
          # use workspace-relative path so the host runner (not the container) can find the logs
          path: |
            build.${{ env.EE_DistroTag }}-${{ env.EE_Device }}.${{ env.EE_Arch }}-13.0-devel/.threads/logs/*.log
              build.${{ env.EE_DistroTag }}-${{ env.EE_Device }}.${{ env.EE_Arch }}-13.0-devel/diagnostic_pre_chown.txt
              ${{ runner.temp }}/diagnostic_pre_chown.txt
          overwrite: true
          include-hidden-files: true

      - name: Upload ccache artifact
        if: ${{ success() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ccache-${{ env.OS_Codename }}-${{ env.EE_Arch }}
          path: |
            .ccache
            build.${{ env.EE_DistroTag }}-${{ env.EE_Device }}.${{ env.EE_Arch }}-13.0-devel/.ccache
            build.${{ env.EE_DistroTag }}-${{ env.EE_Device }}.${{ env.EE_Arch }}-13.0-devel/.cache_package_global
            sources
          if-no-files-found: warn

      - name: Upload stamps artifact
        if: ${{ success() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: stamps-${{ env.OS_Codename }}-${{ env.EE_Arch }}
          path: build.${{ env.EE_DistroTag }}-${{ env.EE_Device }}.${{ env.EE_Arch }}-13.0-devel/.stamps
          if-no-files-found: warn

      - name: Upload apt-cache artifact
        if: ${{ success() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: apt-${{ env.OS_Codename }}-${{ env.EE_Arch }}
          path: .apt-cache/archives
          if-no-files-found: warn

      - name: Copy built ${{ env.EE_DistroTag }} image to archive
        id: image-path
        run: |
          [ "${{ env.DEBUG }}" = "true" ] && echo "[pwd]: ${{ github.workspace }}" || true
          if [ -d ${{ github.workspace }}/target ]; then
            lines=$(find ${{ github.workspace }}/target -maxdepth 1 -type f -iname "${{ env.EE_DistroTag }}-${{ env.EE_Device }}.${{ env.EE_Arch }}*.img.gz" 2>/dev/null | wc -l)
            [ "${{ env.DEBUG }}" = "true" ] && echo "[lines]: $lines" || true
            if [ $lines -ne 0 ]; then
              pathfilename=$(ls -t ${{ github.workspace }}/target/${{ env.EE_DistroTag }}-${{ env.EE_Device }}.${{ env.EE_Arch }}*.img.gz | head --lines=1)
              [ "${{ env.DEBUG }}" = "true" ] && echo "[EE_image_pathfilename]: $pathfilename"
              echo "EE_image_pathfilename=$pathfilename" >> $GITHUB_OUTPUT || true
              filename="${pathfilename##*/}"
              [ "${{ env.DEBUG }}" = "true" ] && echo "[EE_image_filename]: $filename" || true
              echo "EE_image_filename=$filename" >> $GITHUB_OUTPUT
              if [ ! -d /root/target_archive ]; then
                mkdir --parents "/root/target_archive"
              fi
              if [ "$(cp "$pathfilename" "/root/target_archive")" ]; then # --update=older
                echo "Copied built image to /root/target_archive"
              else
                echo "No newer built image to copy to /root/target_archive"
              fi
            else
              echo "No built image found in target directory, skipping copy."
            fi
          else
            echo "No target directory found, skipping copy of built image."
          fi

      - name: Upload built ${{ env.EE_DistroTag }} image
        if: ${{ steps.image-path.outputs.EE_image_pathfilename != '' && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: "${{ steps.image-path.outputs.EE_image_filename }}"
          path: "${{ steps.image-path.outputs.EE_image_pathfilename }}"

      - name: Ensure required directories exist with correct permissions
        run: |
          mkdir -p .ccache "${{ env.BUILD_DIR }}" .apt-cache/archives "${{ env.BUILD_DIR }}/.stamps"
          sudo chmod -R ${{ env.CHMOD_SYNTAX }} .ccache "${{ env.BUILD_DIR }}" .apt-cache "${{ env.BUILD_DIR }}/.stamps"
          sudo chown -R ${{ env.HOST_UID }}:${{ env.HOST_GID }} .ccache "${{ env.BUILD_DIR }}" .apt-cache "${{ env.BUILD_DIR }}/.stamps"

      - name: Verify artifact availability
        run: |
          if [ ! -d "${{ env.BUILD_DIR }}/.stamps" ]; then
            echo "Warning: Stamps artifact is missing. Build may fail."
          fi
          if [ ! -d .ccache ]; then
            echo "Warning: Ccache artifact is missing. Build performance may be degraded."
          fi

      - name: Add fallback for missing toolchain
        run: |
          if [ ! -d "$TARGET_TOOLCHAIN" ]; then
            echo "Toolchain directory missing. Attempting to recreate."
            mkdir -p "$TARGET_TOOLCHAIN"
            docker run --rm \
              --user ${{ env.IMG_UID }}:${{ env.IMG_GID }} \
              --group-add ${{ env.HOST_GID }} \
              -v "${{ github.workspace }}:/build" \
              "$PREBUILT_IMAGE" bash -lc "
                umask 0002
                cp -a /opt/prebuilt-toolchain/* /build/${BUILD_DIR}/ || true
              "
          fi

      # - name: Add detailed logging for make command
      #   run: |
      #     set -x
      #     . /build/build_recommend.sh
      #     make -j${RECOMMENDED_J} -l${NB_CORES} image || {
      #       echo "Make command failed. Capturing logs...";
      #       find /build -name '*.log' -exec cp {} /build/ci-diagnostics/ \; || true;
      #       exit 1;
      #     }

      - name: Consolidate ownership and permissions
        env:
          CACHE_DIRS: ".ccache ${{ env.BUILD_DIR }} .apt-cache ${{ env.BUILD_DIR }}/.stamps"
        run: |
          echo "Using UID:GID = ${{ env.IMG_UID }}:${{ env.IMG_GID }}"

          # Adjust ownership and permissions
          for dir in $CACHE_DIRS; do
            sudo chown -R ${{ env.IMG_UID }}:${{ env.IMG_GID }} "$dir" || true
            sudo chmod -R ${{ env.CHMOD_SYNTAX }} "$dir" || true
          done

          # Ensure specific files exist
          touch "${{ env.BUILD_DIR }}/.cache_package_global" "${{ env.BUILD_DIR }}/.cache_package_local" || true
          sudo chmod -R a=rw "${{ env.BUILD_DIR }}/.cache_package_global" "${{ env.BUILD_DIR }}/.cache_package_local" || true

          # Handle workspace ownership for self-hosted runners
          if [ "${{ inputs.runner || 'self-hosted' }}" != "github" ]; then
            echo "Adjusting workspace ownership to ${{ env.IMG_UID }}:${{ env.IMG_GID }}"
            sudo chown -R ${{ env.IMG_UID }}:${{ env.IMG_GID }} "${GITHUB_WORKSPACE}" || true
          fi
